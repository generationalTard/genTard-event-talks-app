<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Talks Event</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }
        .container {
            max-width: 960px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1, h2 {
            color: #2c3e50;
            text-align: center;
        }
        .search-container {
            margin-bottom: 20px;
            text-align: center;
        }
        .search-container input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        .talk-list {
            list-style: none;
            padding: 0;
        }
        .talk-item {
            background-color: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-bottom: 15px;
            padding: 15px;
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .talk-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }
        .talk-time {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
            display: block;
        }
        .talk-title {
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 5px;
            color: #34495e;
        }
        .talk-speakers {
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
            display: block;
        }
        .talk-category {
            display: inline-block;
            background-color: #e9ecef;
            color: #6c757d;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 10px;
        }
        .talk-description {
            font-size: 15px;
            color: #666;
        }
        .break-item {
            background-color: #ffeeba;
            border: 1px solid #ffc107;
            color: #856404;
            text-align: center;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
        }
        .no-results {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Technical Talks Event Schedule</h1>
        <div class="search-container">
            <input type="text" id="categorySearch" placeholder="Search by category (e.g., AI, Web, Cloud)">
        </div>
        <ul id="talkSchedule" class="talk-list">
            <!-- Talks will be loaded here by JavaScript -->
        </ul>
    </div>

    <script>
        const talksData = [
            {
                title: "Introduction to Modern Web Development",
                speakers: ["Alice Smith"],
                category: ["Web Development", "Frontend"],
                duration: 60,
                description: "A deep dive into the latest trends and technologies shaping web development.",
            },
            {
                title: "Cloud Native Architectures with Kubernetes",
                speakers: ["Bob Johnson", "Carol White"],
                category: ["Cloud", "DevOps"],
                duration: 60,
                description: "Exploring scalable and resilient applications using Kubernetes in the cloud.",
            },
            {
                title: "Machine Learning in Production: Challenges and Solutions",
                speakers: ["David Green"],
                category: ["AI", "Machine Learning"],
                duration: 60,
                description: "From model training to deployment: practical advice for production AI systems.",
            },
            {
                title: "Serverless Functions: Building Event-Driven Systems",
                speakers: ["Eve Black", "Frank Blue"],
                category: ["Cloud", "Serverless"],
                duration: 60,
                description: "How to leverage serverless functions for efficient and cost-effective event processing.",
            },
            {
                title: "Advanced JavaScript Patterns",
                speakers: ["Grace Red"],
                category: ["Web Development", "JavaScript"],
                duration: 60,
                description: "Unlocking powerful JavaScript techniques for cleaner and more maintainable codebases.",
            },
            {
                title: "Data Streaming with Apache Kafka",
                speakers: ["Henry Brown"],
                category: ["Data", "Distributed Systems"],
                duration: 60,
                description: "Understanding the fundamentals of real-time data streaming and processing with Kafka.",
            },
        ];

        function formatTime(date) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function calculateSchedule(talks) {
            const schedule = [];
            let currentTime = new Date();
            currentTime.setHours(10, 0, 0, 0); // Start at 10:00 AM

            const talkDuration = 60; // minutes
            const transitionDuration = 10; // minutes
            const lunchDuration = 60; // minutes

            for (let i = 0; i < talks.length; i++) {
                if (i === 3) { // Insert lunch break after the 3rd talk
                    const lunchStartTime = new Date(currentTime);
                    const lunchEndTime = new Date(lunchStartTime.getTime() + lunchDuration * 60 * 1000);
                    schedule.push({
                        type: 'break',
                        title: 'Lunch Break',
                        startTime: formatTime(lunchStartTime),
                        endTime: formatTime(lunchEndTime)
                    });
                    currentTime = lunchEndTime;
                }

                const talkStartTime = new Date(currentTime);
                const talkEndTime = new Date(talkStartTime.getTime() + talkDuration * 60 * 1000);

                schedule.push({
                    type: 'talk',
                    ...talks[i],
                    startTime: formatTime(talkStartTime),
                    endTime: formatTime(talkEndTime)
                });

                currentTime = talkEndTime;
                if (i < talks.length -1 || i === 2) { // Add transition after talk, unless it's the last talk or before lunch
                    currentTime = new Date(currentTime.getTime() + transitionDuration * 60 * 1000);
                }
            }
            return schedule;
        }

        const fullSchedule = calculateSchedule(talksData);

        function renderSchedule(scheduleToRender) {
            const scheduleContainer = document.getElementById('talkSchedule');
            scheduleContainer.innerHTML = ''; // Clear existing schedule

            if (scheduleToRender.length === 0) {
                scheduleContainer.innerHTML = '<li class="no-results">No talks found matching your search.</li>';
                return;
            }

            scheduleToRender.forEach(item => {
                if (item.type === 'talk') {
                    const talkItem = document.createElement('li');
                    talkItem.className = 'talk-item';
                    talkItem.innerHTML = `
                        <span class="talk-time">${item.startTime} - ${item.endTime}</span>
                        <h3 class="talk-title">${item.title}</h3>
                        <span class="talk-speakers">${item.speakers.join(' and ')}</span>
                        <div>
                            ${item.category.map(cat => `<span class="talk-category">${cat}</span>`).join('')}
                        </div>
                        <p class="talk-description">${item.description}</p>
                    `;
                    scheduleContainer.appendChild(talkItem);
                } else if (item.type === 'break') {
                    const breakItem = document.createElement('li');
                    breakItem.className = 'break-item';
                    breakItem.innerHTML = `
                        <span class="talk-time">${item.startTime} - ${item.endTime}</span>
                        <span>${item.title}</span>
                    `;
                    scheduleContainer.appendChild(breakItem);
                }
            });
        }

        // Initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule(fullSchedule);

            const searchInput = document.getElementById('categorySearch');
            searchInput.addEventListener('keyup', (event) => {
                const searchTerm = event.target.value.toLowerCase();
                const filteredSchedule = fullSchedule.filter(item => {
                    if (item.type === 'break') return true; // Always show breaks
                    return item.category && item.category.some(cat => cat.toLowerCase().includes(searchTerm));
                });
                renderSchedule(filteredSchedule);
            });
        });
    </script>
</body>
</html>
